<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="description" content="英文朗读辅助应用 - 选中单词查音标，点击听发音，全文朗读">
    <title>英文朗读助手</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📖</span>
                <h1>英文朗读助手</h1>
            </div>
            <p class="subtitle">粘贴文章 · 选词查音标 · 全文朗读</p>
        </header>

        <main class="main-content">
            <div class="toolbar">
                <button id="pasteBtn" class="btn btn-primary">
                    <span class="btn-icon">📋</span>
                    <span class="btn-text">粘贴文章</span>
                </button>
                <button id="clearBtn" class="btn btn-outline">
                    <span class="btn-icon">�</span>
                    <span class="btn-text">清空</span>
                </button>
            </div>

            <section class="reading-view" id="readingView">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h3>开始阅读</h3>
                    <p>点击上方"粘贴文章"按钮<br>或直接粘贴英文文章到这里</p>
                </div>
                <div class="article-content" id="articleContent" contenteditable="true"></div>
            </section>

            <section class="control-panel" id="controlPanel" style="display: none;">
                <div class="control-buttons">
                    <button id="readAloudBtn" class="btn btn-primary">
                        <span class="btn-icon">🔊</span>
                        <span class="btn-text">全文朗读</span>
                    </button>
                    <button id="pauseBtn" class="btn btn-secondary" disabled>
                        <span class="btn-icon">⏸</span>
                        <span class="btn-text">暂停</span>
                    </button>
                    <button id="stopBtn" class="btn btn-outline" disabled>
                        <span class="btn-icon">⏹</span>
                        <span class="btn-text">停止</span>
                    </button>
                </div>
                <div class="speed-control">
                    <label for="speedSelect">语速</label>
                    <select id="speedSelect" class="speed-select">
                        <option value="0.5">0.5x 慢</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x 正常</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x 快</option>
                        <option value="2">2x 很快</option>
                    </select>
                </div>
                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
            </section>

            <section class="word-info-panel" id="wordInfoPanel">
                <div class="word-info-content" id="wordInfoContent">
                    <p class="word-info-empty">👆 在上方选中或双击单词<br>即可查看音标和发音</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="shortcuts">
                <span class="shortcut"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 朗读</span>
                <span class="shortcut"><kbd>双击</kbd> 查词</span>
            </div>
        </footer>

        <textarea id="hiddenInput" class="hidden-input"></textarea>
    </div>

    <script src="app.js"></script>
</body>
</html>
